[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "searchify"
version = "0.1.0"
description = "Local-first web search, clean content extraction and fast reranking. No API key required."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "searchify contributors" }]
keywords = ["search", "web-search", "scraping", "extraction", "reranking", "searxng", "duckduckgo"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Text Processing :: Markup :: HTML",
]
dependencies = [
    "httpx>=0.27",
    "httpcore>=1.0",
    "trafilatura>=1.8",
    "lxml>=5.0",
    "resiliparse>=0.14",
    "curl_cffi>=0.7",
    "ddgs>=6.0",
]

[project.optional-dependencies]
rerank = ["sentence-transformers>=3.0"]
browser = ["playwright>=1.44"]
stealth = ["camoufox>=0.4"]
api = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.6"]
mcp = ["mcp>=2.3"]
dev = ["pytest>=8.0"]

[project.scripts]
searchify = "searchify.cli:main"
searchify-mcp = "searchify.mcp_server:main"

[project.urls]
Homepage = "https://github.com/sami-mag07/searchify-l"
Issues = "https://github.com/sami-mag07/searchify-l/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["searchify*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
